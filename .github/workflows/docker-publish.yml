name: Build and publish container

# Builds the Docker image and pushes it to GitHub Container Registry (GHCR)
# at ghcr.io/<owner>/<repo>. TrueNAS then pulls this image (see DEPLOY.md).

on:
  push:
    branches: [main]
    tags: ['v*'] # also publish an image per release tag
  workflow_dispatch: # allow manual runs from the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # metadata-action lowercases this

jobs:
  # Gate the publish on the same checks Claude and the Stop hook run locally.
  # Pushing to main deploys, so a red test must stop the image, not follow it.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22 # matches the Dockerfile's node:22-slim
          cache: npm

      - name: Install
        run: npm ci

      # tsc resolves @prisma/client from generated output, which npm ci does
      # not produce on its own (there is no postinstall). No database needed:
      # generate reads the schema only.
      - name: Generate Prisma client
        run: npx prisma generate

      # Deliberately not `npm run lint` — that script carries --fix for local
      # use, which would quietly rewrite files and pass instead of failing.
      - name: Lint
        run: npx next lint --dir app --dir components --dir lib

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  build-and-push:
    needs: test # no image unless the checks above are green
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64 # TrueNAS SCALE is x86-64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
